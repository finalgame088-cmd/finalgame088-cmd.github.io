function damage(attacker,defender){const eff=effectiveness(attacker.moveType,defender.types);if(eff===0)return {value:0,eff};const special=attacker.category==='特殊';const attack=special?(attacker.spa||attacker.atk):attacker.atk,defense=special&&attacker.moveId!=='psystrike'?(defender.spdef||defender.def):defender.def,level=attacker.level||50;const base=Math.floor(Math.floor((Math.floor(level*2/5)+2)*attacker.power*attack/Math.max(1,defense))/50)+2;const roll=85+Math.floor(Math.random()*16);let value=Math.floor(base*roll/100);if(attacker.types.includes(attacker.moveType))value=Math.floor(value*1.5);return {value:Math.max(1,Math.floor(value*eff)),eff}}
function startFight(){if(state.team.length!==3)return toast('請選滿 3 張卡匣');const id=pickWild(),boss=get(id);state.balls=Math.max(state.balls,3);state.greatBalls=Math.max(state.greatBalls,1);save();fight={boss:id,hp:boss.hp,allies:Object.fromEntries(state.team.map(x=>[x,get(x).hp])),active:state.team[0],last:null,turn:1,taps:0,roulette:1,score:0,phase:'ready',message:`野生的${boss.name}出現了！`,caught:false,lost:false};needle=0;go('battle')}
function startMeter(){if(frame)cancelAnimationFrame(frame);const start=performance.now();function tick(now){needle=(Math.sin((now-start)/330)+1)*50;let n=document.getElementById('needle');if(n)n.style.left=needle+'%';if(screen==='battle'&&fight.phase==='roulette')frame=requestAnimationFrame(tick)}frame=requestAnimationFrame(tick)}
function attack(){if(!fight||fight.phase==='resolving')return;if(fight.phase==='ready'){fight.taps=0;if(fight.active===fight.last){fight.roulette=1;fight.phase='charging';fight.message='連續出戰會疲勞！這回合略過輪盤，快連點加力。';render();phaseTimer=setTimeout(resolve,1900)}else{fight.phase='roulette';fight.message='停下攻擊輪盤！正中央能提高捕捉機會。';render()}return}if(fight.phase==='roulette'){if(frame)cancelAnimationFrame(frame);frame=0;const grade=Math.round(Math.max(0,1-Math.abs(needle-50)/50)*4);fight.roulette=1+grade*.2;fight.phase='charging';fight.taps=0;fight.message=`輪盤 ${grade+1}！快連點按鈕，讓捕捉加成升到 MAX。`;render();phaseTimer=setTimeout(resolve,1900);return}if(fight.phase==='charging'){fight.taps=Math.min(10,fight.taps+1);app.querySelector('.power-title').textContent=`快速連點加力！${fight.taps} / 10`;app.querySelector('.speech').textContent=fight.taps===10?'加力 MAX！':`已加力 ${fight.taps} 次！`}}
function resolve(){phaseTimer=0;if(screen!=='battle'||fight.phase!=='charging')return;fight.phase='resolving';let attacker=get(fight.active),boss=get(fight.boss),tired=fight.last===fight.active,bossFirst=boss.spd>attacker.spd*(tired?.65:1),messages=[];function strikeBoss(){let hit=damage(boss,attacker),taken=hit.value;fight.allies[fight.active]=Math.max(0,fight.allies[fight.active]-taken);messages.push(`${boss.name}先攻，${attacker.name}受到 ${taken} 傷害`);return fight.allies[fight.active]>0}function strikePlayer(){let hit=damage(attacker,boss);fight.hp=Math.max(0,fight.hp-hit.value);messages.push(`${attacker.name}的${attacker.move}造成 ${hit.value} 傷害${hit.eff>1?'，效果絕佳！':hit.eff<1?'，效果不佳。':'。'}`)}if(bossFirst){if(strikeBoss())strikePlayer()}else{strikePlayer();if(fight.hp>0)strikeBoss()}fight.score+=Math.round((fight.roulette-1)*5)+fight.taps;fight.last=fight.active;if(fight.hp===0){state.wins++;save();fight.message='首領倒下，準備投球！';ball=state.balls?'normal':'great';go('capture');return}if(!state.team.some(id=>fight.allies[id]>0)){fight.lost=true;go('result');return}if(!fight.allies[fight.active]){fight.active=state.team.find(id=>fight.allies[id]>0);messages.push(`${get(fight.active).name}接替上場`)}fight.phase='ready';fight.turn++;fight.message=messages.join('；');render()}
function throwBall(){if(screen!=='capture'||busy)return;if(ball==='normal'&&!state.balls||ball==='great'&&!state.greatBalls)return toast('請選還有剩餘的球');busy=true;if(ball==='normal')state.balls--;else state.greatBalls--;save();app.querySelector('#throw-zone')?.classList.add('fly');let ok=Math.random()<Math.min(.96,(ball==='great'?.73:.48)+Math.min(.2,fight.score*.006));setTimeout(()=>{busy=false;if(screen!=='capture')return;if(ok){fight.caught=true;if(!state.owned.some(id=>{const m=get(id);return m?.tagCode===get(fight.boss)?.tagCode&&m?.tagVersion===get(fight.boss)?.tagVersion}))state.owned.push(fight.boss);save();go('result')}else if(state.balls+state.greatBalls){ball=state.balls?'normal':'great';fight.message='差一點！再投一次！';render()}else go('result')},750)}
function setupMulti(mode){if(!['pvp','coop'].includes(mode))return;multi={mode,teams:[[],[]],setupSide:0,active:[0,0],hp:[[],[]],pending:[null,null],turnSide:0,round:1,message:'',boss:null,bossHp:0,winner:null};go('multi-setup')}
function startMulti(){multi.hp=multi.teams.map(team=>team.map(id=>get(id).hp));multi.active=[0,0];if(multi.mode==='coop'){multi.boss=pickWild();multi.bossHp=get(multi.boss).hp*2}multi.turnSide=0;multi.message='玩家 1 選出戰角色';go('multi-battle')}
function alive(side){return multi.hp[side].some(n=>n>0)}

function multiAttack(){if(screen!=='multi-battle')return;const side=multi.turnSide;multi.pending[side]=multi.active[side];if(side===0){go('multi-pass');return}let messages=[];if(multi.mode==='pvp'){const order=[0,1].sort((a,b)=>get(multi.teams[b][multi.pending[b]]).spd-get(multi.teams[a][multi.pending[a]]).spd);for(const from of order){const to=1-from,fi=multi.pending[from],ti=multi.pending[to];if(multi.hp[from][fi]===0||multi.hp[to][ti]===0)continue;const a=get(multi.teams[from][fi]),d=get(multi.teams[to][ti]),hit=damage(a,d);multi.hp[to][ti]=Math.max(0,multi.hp[to][ti]-hit.value);messages.push(`玩家 ${from+1} 的${a.name}對${d.name}造成 ${hit.value} 傷害`)}if(!alive(0)||!alive(1)){multi.winner=alive(0)?0:alive(1)?1:order[0];multi.message=messages.join('；');go('multi-result');return}autoActive(0);autoActive(1)}else{const boss=get(multi.boss);for(const from of [0,1].filter(side=>multi.pending[side]!==null&&alive(side)).sort((a,b)=>get(multi.teams[b][multi.pending[b]]).spd-get(multi.teams[a][multi.pending[a]]).spd)){const index=multi.pending[from],a=get(multi.teams[from][index]),hit=damage(a,boss);multi.bossHp=Math.max(0,multi.bossHp-hit.value);messages.push(`玩家 ${from+1} 的${a.name}造成 ${hit.value} 傷害`);if(multi.bossHp===0)break}if(multi.bossHp===0){state.wins++;if(!state.owned.some(id=>{const m=get(id);return m?.tagCode===boss.tagCode&&m?.tagVersion===boss.tagVersion}))state.owned.push(multi.boss);save();multi.message=messages.join('；')+`；${boss.name}加入共用收藏！`;go('multi-result');return}let to=multi.round%2?0:1;if(!alive(to))to=1-to;const targetIndex=multi.active[to],target=get(multi.teams[to][targetIndex]),hit=damage(boss,target);multi.hp[to][targetIndex]=Math.max(0,multi.hp[to][targetIndex]-hit.value);messages.push(`首領對玩家 ${to+1} 的${target.name}造成 ${hit.value} 傷害`);if(!alive(0)&&!alive(1)){multi.message=messages.join('；')+'；兩人的隊伍都倒下了。';multi.winner=null;go('multi-result');return}for(const side of [0,1])if(alive(side))autoActive(side)}multi.message=messages.join('；');if(multi.round>=20){if(multi.mode==='pvp'){const remaining=side=>multi.hp[side].reduce((total,n)=>total+n,0);multi.winner=remaining(0)>=remaining(1)?0:1;multi.message+='；達到 20 回合上限，以剩餘 HP 判定勝負。'}else multi.message+='；達到 20 回合上限，挑戰失敗。';go('multi-result');return}multi.pending=[null,null];go('multi-summary')}
app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let action=b.dataset.action,id=b.dataset.id;if(action==='home'){busy=false;go('home')}else if(action==='team')go('team');else if(action==='collection')go('collection');else if(action==='add'){editing=null;pendingTag=null;presetOverride=null;go('add')}else if(action==='edit'){editing=id;pendingTag=null;presetOverride=null;go('add')}else if(action==='apply-preset'){const old=get(editing),card=old?.tagCode?catalog.find(c=>c.code===old.tagCode&&c.version===old.tagVersion):null;if(!card)return toast('這張卡沒有可套用的圖鑑預設值');presetOverride={...old,...card,id:old.id,tagCode:old.tagCode,tagVersion:old.tagVersion,star:old.star};render();toast('已帶入本傳預設；確認後按下儲存')}else if(action==='catalog'){catalogReturn=screen;catalogPage=0;go('catalog')}else if(action==='catalog-filter'){catalogVersion=id;catalogPage=0;render()}else if(action==='catalog-prev'){catalogPage--;render()}else if(action==='catalog-next'){catalogPage++;render()}else if(action==='catalog-add'){pendingTag=catalog[Number(id)]||null;editing=null;go('add')}else if(action==='mode')setupMulti(id);else if(action==='multi-toggle'){let team=multi.teams[multi.setupSide];if(team.includes(id))multi.teams[multi.setupSide]=team.filter(x=>x!==id);else if(team.length<3)team.push(id);else return toast('每人最多選 3 張');render()}else if(action==='multi-next'){if(multi.teams[multi.setupSide].length!==3)return toast('請選滿 3 張');if(multi.setupSide===0){multi.setupSide=1;render()}else startMulti()}else if(action==='multi-active'){multi.active[multi.turnSide]=Number(id);render()}else if(action==='multi-attack')multiAttack();else if(action==='multi-continue'){multi.turnSide=1;multi.message='玩家 2 選出戰角色';go('multi-battle')}else if(action==='multi-next-round'){multi.round++;multi.turnSide=alive(0)?0:1;multi.message=`玩家 ${multi.turnSide+1} 選出戰角色`;go('multi-battle')}else if(action==='toggle'){if(state.team.includes(id))state.team=state.team.filter(x=>x!==id);else if(state.team.length<3)state.team.push(id);else return toast('最多選 3 張，先取消一張');save();render()}else if(action==='area'){state.area=Number(id);save();render()}else if(action==='start')startFight();else if(action==='ally'){fight.active=id;fight.message=`換上${get(id).name}！`;render()}else if(action==='attack')attack();else if(action==='ball'){ball=id;render()}else if(action==='throw')throwBall()});
app.addEventListener('submit',e=>{if(e.target.id==='catalog-search'){e.preventDefault();catalogQuery=String(new FormData(e.target).get('q')||'').trim().slice(0,60);catalogPage=0;render();return}if(e.target.id!=='tag-form')return;e.preventDefault();let form=new FormData(e.target),name=String(form.get('name')||'').trim(),move=String(form.get('move')||'').trim(),dex=String(form.get('dex')||'').trim(),stats={};for(const field of ['level','hp','atk','def','spa','spdef','spd','power']){let n=Number(form.get(field));if(!Number.isInteger(n)||n<1||n>(field==='level'?100:field==='power'?300:999))return toast('能力值須為範圍內的整數');stats[field]=n}if(!name||!move)return toast('請填名稱和招式');if(dex&&(!Number.isInteger(Number(dex))||Number(dex)<1||Number(dex)>1100))return toast('請填有效圖鑑編號');if(state.custom.length>=700&&!editing)return toast('最多儲存 700 張自訂卡匣');const data={name:name.slice(0,24),move:move.slice(0,30),dex:dex?Number(dex):null,types:[form.get('type1'),form.get('type2')].filter(Boolean),moveType:form.get('moveType'),category:form.get('category'),star:Number(form.get('star')),tagCode:editing?get(editing)?.tagCode||null:pendingTag?.code||null,tagVersion:editing?get(editing)?.tagVersion||null:pendingTag?.version||null,moveId:(presetOverride||pendingTag)?.moveId||null,statSource:pendingTag||presetOverride?'本傳估算':'手動輸入',moveSource:(presetOverride||pendingTag)?.moveSource||null,...stats};const sourceCard=pendingTag||(data.tagCode?catalog.find(c=>c.code===data.tagCode&&c.version===data.tagVersion):null);if(sourceCard){const sameMove=data.move===sourceCard.move&&data.moveType===sourceCard.moveType&&data.category===sourceCard.category&&data.power===sourceCard.power;data.moveId=sameMove?sourceCard.moveId:null;data.moveSource=sameMove?sourceCard.moveSource:null;data.statSource=['level','hp','atk','def','spa','spdef','spd'].every(k=>data[k]===sourceCard[k])&&data.types.join('/')===sourceCard.types.join('/')&&sameMove?'本傳估算':'手動輸入'}if(!types.includes(data.types[0])||data.types.some(x=>!types.inc
