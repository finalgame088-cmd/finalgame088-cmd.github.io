<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11142d">
<title>星獸對決・手機遊戲</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",system-ui,sans-serif;color:#fff;--muted:#a9b5d6;--card:#212849;--line:#52618d;--yellow:#ffda55}*{box-sizing:border-box}html{background:#101328}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 6%,#343c78 0,#171a39 42%,#0e1126 100%)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}.app{max-width:480px;min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 20px);position:relative;overflow:hidden}.app:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff7 1px,transparent 1px);background-size:29px 33px;opacity:.08;pointer-events:none}.content{position:relative;z-index:1}header{display:flex;align-items:center;justify-content:space-between;padding:17px 0 10px}.brand{font-size:17px;font-weight:900;letter-spacing:.07em}.brand b{color:var(--yellow)}.iconbtn{width:42px;height:42px;border:1px solid #52618d;border-radius:13px;background:#282f52;color:white;font-size:19px}.eyebrow{color:#83e8fa;font-weight:800;letter-spacing:.16em;font-size:11px;margin:6px 0}.title{font-size:30px;line-height:1.18;margin:7px 0 10px;letter-spacing:.015em}.sub{color:var(--muted);line-height:1.55;font-size:14px;margin:0 0 19px}.hero{border:1px solid #6e6a9d;border-radius:26px;padding:19px;background:radial-gradient(circle at 50% 40%,#826bd7aa,#2a3560 60%,#1b254c);min-height:269px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 22px 50px #090d2b99}.hero:before{content:"";position:absolute;inset:10%;border:1px solid #c5d8ff30;border-radius:50%;transform:scaleX(1.45)}.hero .creature{font-size:116px;filter:drop-shadow(0 13px 7px #1115359c);animation:bob 2.7s ease-in-out infinite}.hero .spark{font-size:23px;color:var(--yellow);letter-spacing:28px}.hero .hero-label{font-size:12px;font-weight:900;letter-spacing:.14em;background:#ffdb58;color:#242345;padding:7px 13px;border-radius:999px;margin:8px}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 1px 11px}.section h2{font-size:18px;margin:0}.section small,.muted{color:var(--muted)}.pill{border-radius:100px;padding:7px 11px;font-weight:800;color:#eadbff;background:#46436c;font-size:12px}.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{background:#222949;border:1.5px solid #3c476f;border-radius:18px;min-height:126px;padding:10px 6px;text-align:center;color:white;position:relative;transition:transform .15s,border-color .15s}.tile:active,.primary:active{transform:scale(.97)}.tile.selected{border:2px solid #ffdb58;background:#384061}.tile .emoji{font-size:42px;display:block;line-height:1.2}.tile strong{font-size:13px;display:block;margin-top:5px}.tile small{font-size:11px;color:#aebcda}.tick{position:absolute;right:7px;top:7px;border-radius:50%;background:var(--yellow);color:#202348;width:21px;height:21px;font-size:14px;font-weight:900}.primary{width:100%;border:0;border-radius:18px;padding:16px 18px;background:linear-gradient(110deg,#ffe66b,#ffb84e);color:#24203b;font-size:17px;font-weight:900;box-shadow:0 7px 0 #bf7431,0 14px 29px #e4953477;margin-top:16px}.primary:disabled{box-shadow:none}.secondary{border:1px solid #606e9f;border-radius:14px;background:#283153;color:#fff;font-weight:800;padding:11px 16px}.note{color:#a9b5d6;font-size:12px;text-align:center;margin:16px 3px;line-height:1.5}.battle-top{display:flex;gap:8px;align-items:center;margin:5px 0 13px}.battle-top .pill{margin-left:auto}.arena{min-height:332px;border:1px solid #7a78b4;border-radius:25px;background:radial-gradient(circle at 50% 49%,#6571c0 0,#344675 43%,#1d2d52 85%);padding:19px 18px;position:relative;text-align:center;overflow:hidden}.arena:before{content:"";position:absolute;width:300px;height:300px;border:1px solid #dbf4ff35;border-radius:50%;left:50%;top:45%;transform:translate(-50%,-50%) scaleX(1.4)}.arena>*{position:relative}.boss-name{font-size:19px;font-weight:900}.boss-rarity{font-size:11px;color:#ffda58;letter-spacing:.13em}.boss-emoji{font-size:111px;line-height:1.4;display:block;filter:drop-shadow(0 17px 8px #1c224b8c);animation:bob 2.4s infinite}.hp-label{display:flex;justify-content:space-between;margin:7px auto 5px;max-width:285px;font-weight:800;font-size:12px}.hp{height:13px;border:2px solid #ffffff90;border-radius:99px;max-width:285px;margin:auto;overflow:hidden;background:#222844}.hp span{display:block;height:100%;background:linear-gradient(90deg,#ff637d,#ffcb59);border-radius:99px;transition:width .4s}.speech{background:#151c3ecd;border:1px solid #6576b2;border-radius:13px;padding:11px;margin:13px auto 0;min-height:44px;line-height:1.35;font-size:13px;max-width:350px}.teamline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ally{background:#242e51;color:white;border:1.5px solid #485780;border-radius:17px;padding:8px 3px 6px;min-height:90px}.ally.active{border-color:#ffdd5d;background:#3b4365}.ally.fainted{opacity:.43}.ally .face{font-size:35px;display:block}.ally .health{font-size:11px;color:#c9d6f7}.power-wrap{background:#222a4b;border:1px solid #47557e;padding:15px;border-radius:18px;margin-top:15px}.power-title{font-size:13px;font-weight:800;text-align:center}.meter{height:23px;border-radius:99px;position:relative;margin:14px 0 4px;background:linear-gradient(90deg,#715dab,#699bfa 28%,#ffe074 42%,#7eeeb3 50%,#ffe074 58%,#699bfa 72%,#715dab);border:2px solid #cad5fd;overflow:visible}.meter:after{content:"完美";position:absolute;left:50%;transform:translateX(-50%);top:-4px;background:#fff0a4;color:#28233d;border-radius:9px;padding:3px 6px;font-size:10px;font-weight:900}.needle{position:absolute;height:34px;width:4px;top:-7px;left:0%;background:#fff;border:1px solid #242642;box-shadow:0 0 9px white;border-radius:6px;z-index:2}.regions{display:grid;gap:9px}.region{width:100%;text-align:left;display:flex;align-items:center;gap:14px;border:1.5px solid #4a547f;border-radius:18px;padding:12px 14px;color:#fff;background:#252c50}.region.current{border-color:var(--yellow);background:#343c63}.region .scene{font-size:37px}.region strong,.region small{display:block}.region small{color:#b3bfdd;font-size:11px;margin-top:2px}.collection{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.collect-card{border:1px solid #6a629c;background:linear-gradient(150deg,#3d4781,#1d284c);border-radius:19px;padding:11px;min-height:145px;position:relative;box-shadow:inset 0 1px #ffffff36}.collect-card .cemoji{font-size:61px;display:block;text-align:center}.collect-card strong{display:block;font-size:14px}.collect-card small{color:#b9c8e9}.collect-card .stars{position:absolute;top:10px;right:10px;color:#ffdb56;font-size:11px}.empty{padding:30px 13px;text-align:center;border:1px dashed #627096;border-radius:17px;color:#b3bfdc;grid-column:span 2}.throw-zone{border:2px dashed #93a8d1;border-radius:24px;margin:20px auto;padding:15px 15px 23px;text-align:center;touch-action:none;user-select:none;background:#20294a;max-width:270px}.ball{font-size:75px;display:block;transition:transform .35s,opacity .35s}.throw-zone.fly .ball{transform:translateY(-100px) scale(.35);opacity:0}.throw-zone small{color:#aebfde}.choice{display:flex;gap:9px}.choice button{flex:1;background:#2a345a;border:1.5px solid #53638f;color:#fff;border-radius:17px;padding:13px 6px;font-weight:800}.choice button.current{border-color:#ffe06e;background:#4a4871}.result-emoji{font-size:105px;text-align:center;margin:18px 0 5px;animation:bob 2s infinite}.result-panel{text-align:center;border:1px solid #aa86cc;border-radius:25px;padding:23px 15px;background:linear-gradient(150deg,#47468b,#242c59)}.result-panel h2{font-size:28px;margin:9px 0}.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translateX(-50%);padding:11px 16px;background:#eff8ff;color:#18203e;border-radius:12px;font-size:13px;font-weight:800;z-index:8;max-width:90%;text-align:center;box-shadow:0 8px 22px #0008}.flash{animation:flash .3s}.shake{animation:shake .35s}@keyframes bob{50%{transform:translateY(-9px)}}@keyframes flash{50%{filter:brightness(2)}}@keyframes shake{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}@media(max-height:720px){.hero{min-height:215px}.hero .creature{font-size:89px}.arena{min-height:275px}.boss-emoji{font-size:87px}}
</style>
</head>
<body><main class="app"><div class="content" id="app"></div></main>
<script>
(()=>{'use strict';
const monsters={flare:{name:'焰尾狐',emoji:'🦊',type:'火',hp:110,atk:41,star:3},dew:{name:'浪花豚',emoji:'🐬',type:'水',hp:120,atk:36,star:3},leaf:{name:'森角鹿',emoji:'🦌',type:'木',hp:125,atk:35,star:3},volt:{name:'閃電貓',emoji:'🐈',type:'雷',hp:105,atk:44,star:3},rock:{name:'岩甲犀',emoji:'🦏',type:'岩',hp:150,atk:43,star:5},owl:{name:'夜羽鴞',emoji:'🦉',type:'風',hp:135,atk:46,star:5},dragon:{name:'星鱗龍',emoji:'🐉',type:'星',hp:165,atk:49,star:6}};
const areas=[{name:'星光森林',icon:'🌲',detail:'可能遇見：夜羽鴞、岩甲犀',pool:['owl','rock']},{name:'熔岩山谷',icon:'🌋',detail:'可能遇見：岩甲犀、星鱗龍',pool:['rock','dragon']},{name:'月光海岸',icon:'🌊',detail:'可能遇見：夜羽鴞、星鱗龍',pool:['owl','dragon']}];
const key='starbeasts-save-v1';const starters=['flare','dew','leaf','volt'];const app=document.querySelector('#app');let saved;try{saved=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}if(!saved||!Array.isArray(saved.owned)||!Array.isArray(saved.team))saved={owned:[...starters],team:['flare','dew','leaf'],area:0,balls:3,greatBalls:1,wins:0};saved.owned=saved.owned.filter(id=>monsters[id]);for(const id of starters)if(!saved.owned.includes(id))saved.owned.push(id);saved.team=saved.team.filter(id=>saved.owned.includes(id)).slice(0,3);saved.area=Math.min(2,Math.max(0,Number(saved.area)||0));saved.balls=Math.max(0,Number(saved.balls)||0);saved.greatBalls=Math.max(0,Number(saved.greatBalls)||0);saved.wins=Math.max(0,Number(saved.wins)||0);
let screen='home',fight=null,needle=0,frame=0,last=0,selectedBall='normal',busy=false,notice='';function save(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}}function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stopMeter(){if(frame)cancelAnimationFrame(frame);frame=0;last=0}function header(back){return `<header><span class="brand">✦ <b>星獸</b>對決</span><button class="iconbtn" data-action="${back||'collection'}" aria-label="${back?'返回':'查看收藏'}">${back?'←':'▦'}</button></header>`}function go(to){stopMeter();screen=to;render()}function toast(s){notice=s;render();setTimeout(()=>{if(notice===s){notice='';document.querySelector('.toast')?.remove()}},2400)}function render(){let html='';if(screen==='home'){html=header()+`<div class="eyebrow">POCKET BATTLE · 第一關</div><h1 class="title">出發，成為<br>星獸訓練家！</h1><p class="sub">選好 3 位夥伴，挑戰野生首領。抓準時機攻擊，打贏就能投球捕捉！</p><div class="hero"><span class="spark">✦ ✧ ✦</span><span class="creature">🐉</span><span class="hero-label">傳說首領即將現身</span></div><button class="primary" data-action="team">開始冒險　➜</button><div class="section"><h2>我的冒險</h2><small>${saved.wins} 場勝利</small></div><div class="row"><div class="tile"><span class="emoji">🎴</span><strong>${saved.owned.length} 隻</strong><small>已收集</small></div><div class="tile"><span class="emoji">🔴</span><strong>${saved.balls} 顆</strong><small>一般球</small></div><div class="tile"><span class="emoji">⭐</span><strong>${saved.greatBalls} 顆</strong><small>強力球</small></div></div><p class="note">遊戲進度會保存在這台裝置的瀏覽器中。</p>`}
if(screen==='team'){html=header('home')+`<div class="eyebrow">01 / TEAM</div><h1 class="title">選擇你的 3 隻夥伴</h1><p class="sub">點選卡片編成隊伍。戰鬥中可隨時切換還有體力的夥伴。</p><div class="section"><h2>我的星獸</h2><span class="pill">${saved.team.length} / 3</span></div><div class="row">${saved.owned.map(id=>{const m=monsters[id],on=saved.team.includes(id);return `<button class="tile ${on?'selected':''}" data-action="toggle" data-id="${id}" aria-pressed="${on}">${on?'<span class="tick">✓</span>':''}<span class="emoji">${m.emoji}</span><strong>${m.name}</strong><small>${m.type}屬性 · ${'★'.repeat(m.star)}</small></button>`}).join('')}</div><div class="section"><h2>選擇地區</h2></div><div class="regions">${areas.map((a,i)=>`<button class="region ${saved.area===i?'current':''}" data-action="area" data-id="${i}" aria-pressed="${saved.area===i}"><span class="scene">${a.icon}</span><span><strong>${a.name}</strong><small>${a.detail}</small></span></button>`).join('')}</div><button class="primary" data-action="start" ${saved.team.length!==3?'disabled':''}>挑戰野生首領　⚔</button>`}
if(screen==='battle'){let boss=monsters[fight.boss],hp=Math.max(0,fight.hp),max=boss.hp+45,active=fight.active;html=header('leave')+`<div class="battle-top"><span class="pill">${areas[saved.area].icon} ${areas[saved.area].name}</span><span class="pill">第 ${fight.turn} 回合</span></div><div class="arena" id="arena"><div class="boss-rarity">${'★'.repeat(boss.star)} · WILD BOSS</div><div class="boss-name">${boss.name}</div><span class="boss-emoji">${boss.emoji}</span><div class="hp-label"><span>首領 HP</span><span>${hp} / ${max}</span></div><div class="hp"><span style="width:${hp/max*100}%"></span></div><div class="speech" aria-live="polite">${escapeText(fight.message)}</div></div><div class="section"><h2>上場夥伴</h2><small>點選切換</small></div><div class="teamline">${saved.team.map(id=>{let m=monsters[id],life=fight.allies[id];return `<button class="ally ${id===active?'active':''} ${life<=0?'fainted':''}" data-action="ally" data-id="${id}" ${life<=0||fight.phase!=='ready'?'disabled':''}><span class="face">${m.emoji}</span><strong>${m.name}</strong><span class="health">HP ${Math.max(0,life)}/${m.hp}</span></button>`}).join('')}</div><div class="power-wrap"><div class="power-title">${fight.phase==='charging'?'看準中央綠色區域，立刻按下！':'抓準時機，提升攻擊威力'}</div><div class="meter"><div class="needle" id="needle" style="left:${needle}%"></div></div></div><button class="primary" data-action="attack" ${fight.phase==='resolving'?'disabled':''}>${fight.phase==='charging'?'⚡ 現在出招！':'⚡ 開始蓄力'}</button><p class="note">正中間傷害最高；首領每回合都會反擊。</p>`}
if(screen==='capture'){const m=monsters[fight.boss],available=saved.balls+saved.greatBalls;html=header('home')+`<div class="eyebrow">03 / CAPTURE</div><h1 class="title">捕捉時間！</h1><p class="sub">${m.name} 已失去戰鬥能力。選一顆球，再向上滑動投出；也可以點按投球。</p><div class="arena" style="min-height:236px"><div class="boss-rarity">${'★'.repeat(m.star)} · WILD BOSS</div><span class="boss-emoji" style="font-size:94px">${m.emoji}</span><div class="boss-name">${m.name}</div><div class="speech">${escapeText(fight.message)}</div></div><div class="throw-zone" id="throw-zone" role="button" tabindex="0" aria-label="向上滑動或點擊投球"><span class="ball">${selectedBall==='great'?'🟡':'🔴'}</span><strong>向上滑動投球 ↑</strong><br><small>或按下方按鈕</small></div><div class="choice"><button class="${selectedBall==='normal'?'current':''}" data-action="ball" data-id="normal" ${saved.balls<1?'disabled':''}>🔴 一般球 × ${saved.balls}</button><button class="${selectedBall==='great'?'current':''}" data-action="ball" data-id="great" ${saved.greatBalls<1?'disabled':''}>🟡 強力球 × ${saved.greatBalls}</button></div><button class="primary" data-action="throw" ${available<1?'disabled':''}>投出捕捉球　↑</button>${available<1?'<button class="secondary" style="width:100%;margin-top:16px" data-action="home">返回主畫面</button>':''}<p class="note">每次冒險開始時會補充捕捉球。</p>`}
if(screen==='result'){const m=monsters[fight.boss];html=header('home')+`<div class="eyebrow">MISSION COMPLETE</div><div class="result-panel"><div class="result-emoji">${fight.caught?m.emoji:'🌟'}</div><div class="boss-rarity">${fight.caught?'NEW STAR BEAST':'KEEP EXPLORING'}</div><h2>${fight.caught?'捕捉成功！':fight.lost?'這次先撤退！':'差一點就抓到了！'}</h2><p class="sub">${fight.caught?`「${m.name}」加入你的收藏，可以在下一場戰鬥派牠上場。`:fight.lost?'更換夥伴、抓準加力時機，再來挑戰！':'首領逃走了。下一場冒險再試一次！'}</p></div><button class="primary" data-action="team">再玩一場　➜</button><button class="secondary" style="width:100%;margin-top:17px" data-action="collection">查看我的收藏</button>`}
if(screen==='collection'){html=header('home')+`<div class="eyebrow">MY COLLECTION</div><h1 class="title">我的星獸收藏</h1><p class="sub">已收集 ${saved.owned.length} / ${Object.keys(monsters).length} 隻 · 勝利 ${saved.wins} 場</p><div class="collection">${saved.owned.map(id=>{const m=monsters[id];return `<div class="collect-card"><span class="stars">${'★'.repeat(m.star)}</span><span class="cemoji">${m.emoji}</span><strong>${m.name}</strong><small>${m.type}屬性 · HP ${m.hp}</small></div>`}).join('')}</div><button class="primary" data-action="team">編成隊伍　➜</button><p class="note">收集更多首領，組成你最喜歡的隊伍！</p>`}
app.innerHTML=html+(notice?`<div class="toast" role="status">${escapeText(notice)}</div>`:'');if(screen==='capture'){const zone=document.querySelector('#throw-zone');let y=null;zone.addEventListener('pointerdown',e=>{y=e.clientY});zone.addEventListener('pointerup',e=>{if(y!==null&&y-e.clientY>35)throwBall();y=null});zone.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();throwBall()}})}if(screen==='battle'&&fight.phase==='charging')startMeter()}
function startFight(){if(saved.team.length!==3)return toast('請選滿 3 隻夥伴');const a=areas[saved.area],id=a.pool[Math.floor(Math.random()*a.pool.length)],boss=monsters[id];saved.balls=Math.max(saved.balls,3);saved.greatBalls=Math.max(saved.greatBalls,1);save();fight={boss:id,hp:boss.hp+45,allies:Object.fromEntries(saved.team.map(id=>[id,monsters[id].hp])),active:saved.team[0],turn:1,phase:'ready',message:`野生的${boss.name}出現了！先選夥伴，再按「開始蓄力」。`,caught:false,lost:false};needle=0;go('battle')}
function startMeter(){stopMeter();let origin=performance.now();function tick(now){needle=(Math.sin((now-origin)/390)+1)*50;let el=document.querySelector('#needle');if(el)el.style.left=needle+'%';if(screen==='battle'&&fight.phase==='charging')frame=requestAnimationFrame(tick)}frame=requestAnimationFrame(tick)}
function attack(){if(!fight||fight.phase==='resolving')return;if(fight.phase==='ready'){fight.phase='charging';fight.message='指針到中央綠色區域時，再點「現在出招」！';render();return}stopMeter();fight.phase='resolving';const accuracy=Math.max(0,1-Math.abs(needle-50)/50),ally=monsters[fight.active],bonus=ally.type==='水'&&fight.boss==='rock'?1.2:ally.type==='火'&&fight.boss==='owl'?1.2:1,damage=Math.round((ally.atk*.63+accuracy*ally.atk*.96)*bonus);fight.hp=Math.max(0,fight.hp-damage);fight.message=`${ally.name}使出星能衝擊！${accuracy>.82?'完美加力！ ':''}造成 ${damage} 點傷害。`;render();document.querySelector('#arena')?.classList.add('flash');if(fight.hp===0){setTimeout(()=>{if(screen!=='battle')return;saved.wins++;save();fight.message='首領倒下了！準備投球捕捉。';selectedBall=saved.balls?'normal':'great';go('capture')},950);return}setTimeout(()=>{if(screen!=='battle')return;const damageBack=Math.round(17+Math.random()*14),id=fight.active;fight.allies[id]=Math.max(0,fight.allies[id]-damageBack);let msg=`${monsters[fight.boss].name}反擊！${monsters[id].name}受到 ${damageBack} 點傷害。`;if(!fight.allies[id]){const next=saved.team.find(x=>fight.allies[x]>0);if(next){fight.active=next;msg+=` ${monsters[next].name}上場！`}else{fight.lost=true;go('result');return}}fight.turn++;fight.phase='ready';fight.message=msg;render();document.querySelector('#arena')?.classList.add('shake')},900)}
function throwBall(){if(screen!=='capture'||busy)return;if(selectedBall==='normal'&&saved.balls<1||selectedBall==='great'&&saved.greatBalls<1){toast('這種球已用完，請改選另一種');return}busy=true;selectedBall==='normal'?saved.balls--:saved.greatBalls--;save();document.querySelector('#throw-zone')?.classList.add('fly');let caught=Math.random()<(selectedBall==='great'?.87:.65);setTimeout(()=>{busy=false;if(screen!=='capture')return;if(caught){fight.caught=true;if(!saved.owned.includes(fight.boss))saved.owned.push(fight.boss);save();go('result')}else if(saved.balls+saved.greatBalls){selectedBall=saved.balls?'normal':'great';fight.message='差一點！再投一次吧！';render()}else{fight.caught=false;go('result')}},700)}
app.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;let a=btn.dataset.action,id=btn.dataset.id;if(a==='home'){busy=false;go('home')}else if(a==='team')go('team');else if(a==='collection')go('collection');else if(a==='toggle'){if(saved.team.includes(id))saved.team=saved.team.filter(x=>x!==id);else if(saved.team.length<3)saved.team.push(id);else return toast('最多選 3 隻，請先取消一隻');save();render()}else if(a==='area'){saved.area=Number(id);save();render()}else if(a==='start')startFight();else if(a==='ally'){fight.active=id;fight.message=`換上${monsters[id].name}！準備攻擊。`;render()}else if(a==='attack')attack();else if(a==='ball'){selectedBall=id;render()}else if(a==='throw')throwBall();else if(a==='leave'){busy=false;go('home')}});save();render();
})();
</script></body></html>
