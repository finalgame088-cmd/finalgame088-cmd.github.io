<style>

rder:1.5px solid #4a547f;border-radius:18px;padding:12px 14px;color:#fff;background:#252c50}.region.current{border-color:var(--yellow);background:#343c63}.region .scene{font-size:37px}.region strong,.region small{display:block}.region small{color:#b3bfdd;font-size:11px;margin-top:2px}.collection{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.collect-card{border:1px solid #6a629c;background:linear-gradient(150deg,#3d4781,#1d284c);border-radius:19px;padding:11px;min-height:145px;position:relative;box-shadow:inset 0 1px #ffffff36}.collect-card .cemoji{font-size:61px;display:block;text-align:center}.collect-card strong{display:block;font-size:14px}.collect-card small{color:#b9c8e9}.collect-card .stars{position:absolute;top:10px;right:10px;color:#ffdb56;font-size:11px}.empty{padding:30px 13px;text-align:center;border:1px dashed #627096;border-radius:17px;color:#b3bfdc;grid-column:span 2}.throw-zone{border:2px dashed #93a8d1;border-radius:24px;margin:20px auto;padding:15px 15px 23px;text-align:center;touch-action:none;user-select:none;background:#20294a;max-width:270px}.ball{font-size:75px;display:block;transition:transform .35s,opacity .35s}.throw-zone.fly .ball{transform:translateY(-100px) scale(.35);opacity:0}.throw-zone small{color:#aebfde}.choice{display:flex;gap:9px}.choice button{flex:1;background:#2a345a;border:1.5px solid #53638f;color:#fff;border-radius:17px;padding:13px 6px;font-weight:800}.choice button.current{border-color:#ffe06e;background:#4a4871}.result-emoji{font-size:105px;text-align:center;margin:18px 0 5px;animation:bob 2s infinite}.result-panel{text-align:center;border:1px solid #aa86cc;border-radius:25px;padding:23px 15px;background:linear-gradient(150deg,#47468b,#242c59)}.result-panel h2{font-size:28px;margin:9px 0}.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translateX(-50%);padding:11px 16px;background:#eff8ff;color:#18203e;border-radius:12px;font-size:13px;font-weight:800;z-index: .portrait{display:inline-grid;place-items:center;position:relative;vertical-align:middle;width:70px;height:70px}.portrait .fallback{font-size:32px;color:#ffdf70;font-weight:900}.poke-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 8px #11163295)}.portrait.small{width:58px;height:58px}.portrait.medium{display:grid;margin:auto;width:94px;height:85px}.portrait.tiny{width:45px;height:45px}.portrait.hero-art{width:160px;height:163px;margin:17px auto}.portrait.boss-art{display:grid;width:142px;height:142px;margin:0 auto}.portrait.result-art{display:grid;width:176px;height:175px;margin:auto}.hero{min-height:255px}.arena{min-height:280px}.arena.compact{min-height:226px}.tile .portrait{display:grid;margin:auto}.tile{min-height:136px}.ally .portrait{display:grid;margin:auto}.ally strong{display:block;font-size:11px}.ally .health{display:block}.collect-card .portrait{margin:8px auto}.collect-card small{display:block}.full{width:100%;margin-top:14px}.field{display:grid;gap:7px;color:#c9d5f1;font-weight:800;font-size:13px;margin:13px 0}.field input,.field select{width:100%;min-width:0;border:1px solid #6877a3;border-radius:13px;background:#212a4c;color:#fff;padding:13px;font:inherit;outline:none}.field input:focus,.field select:focus{border-color:#ffe274}.field input::placeholder{color:#899abc}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.formgrid .field{min-width:0}.edit{margin-top:8px;border:1px solid #7485ba;border-radius:10px;background:#2e3862;color:#fff;padding:6px 9px;font-size:11px}.collect-card{min-height:196px}.hero .hero-label{position:relative}.teamline .ally{min-height:100px}

<body><main class="app"><div class="content" id="app"></div></main>
<script>
(()=>{'use strict';
const base={pikachu:{name:'皮卡丘',dex:25,types:['電'],move:'十萬伏特',moveType:'電',power:90,hp:136,atk:115,def:82,spd:140,star:4},charizard:{name:'噴火龍',dex:6,types:['火','飛行'],move:'噴射火焰',moveType:'火',power:90,hp:188,atk:142,def:115,spd:123,star:5},greninja:{name:'甲賀忍蛙',dex:658,types:['水','惡'],move:'水之波動',moveType:'水',power:80,hp:162,atk:140,def:90,spd:150,star:5},lucario:{name:'路卡利歐',dex:448,types:['格鬥','鋼'],move:'波導彈',moveType:'格鬥',power:85,hp:170,atk:136,def:110,spd:132,star:5},venusaur:{name:'妙蛙花',dex:3,types:['草','毒'],move:'能量球',moveType:'草',power:90,hp:203,atk:130,def:132,spd:105,star:5},blastoise:{name:'水箭龜',dex:9,types:['水'],move:'水炮',moveType:'水',power:105,hp:215,atk:127,def:150,spd:98,star:5},gengar:{name:'耿鬼',dex:94,types:['幽靈','毒'],move:'暗影球',moveType:'幽靈',power:90,hp:188,atk:150,def:105,spd:136,star:5},mewtwo:{name:'超夢',dex:150,types:['超能力'],move:'精神強念',moveType:'超能力',power:100,hp:255,atk:168,def:135,spd:163,star:6},rayquaza:{name:'烈空坐',dex:384,types:['龍','飛行'],move:'龍之波動',moveType:'龍',power:95,hp:270,atk:172,def:144,spd:145,star:6}};
const types=['一般','火','水','草','電','冰','格鬥','毒','地面','飛行','超能力','蟲','岩石','幽靈','龍','惡','鋼','妖精'];
const chart={一般:{岩石:.5,幽靈:0,鋼:.5},火:{火:.5,水:.5,草:2,冰:2,蟲:2,岩石:.5,龍:.5,鋼:2},水:{火:2,水:.5,草:.5,地面:2,岩石:2,龍:.5},草:{火:.5,水:2,草:.5,毒:.5,地面:2,飛行:.5,蟲:.5,岩石:2,龍:.5,鋼:.5},電:{水:2,草:.5,電:.5,地面:0,飛行:2,龍:.5},冰:{火:.5,水:.5,草:2,冰:.5,地面:2,飛行:2,龍:2,鋼:.5},格鬥:{一般:2,冰:2,毒:.5,飛行:.5,超能力:.5,蟲:.5,岩石:2,幽靈:0,惡:2,鋼:2,妖精:.5},毒:{草:2,毒:.5,地面:.5,岩石:.5,幽靈:.5,鋼:0,妖精:2},地面:{火:2,電:2,草:.5,毒:2,飛行:0,蟲:.5,岩石:2,鋼:2},飛行:{電:.5,草:2,格鬥:2,蟲:2,岩石:.5,鋼:.5},超能力:{格鬥:2,毒:2,超能力:.5,惡:0,鋼:.5},蟲:{火:.5,草:2,格鬥:.5,毒:.5,飛行:.5,超能力:2,幽靈:.5,惡:2,鋼:.5,妖精:.5},岩石:{火:2,冰:2,格鬥:.5,地面:.5,飛行:2,蟲:2,鋼:.5},幽靈:{一般:0,超能力:2,幽靈:2,惡:.5},龍:{龍:2,鋼:.5,妖精:0},惡:{格鬥:.5,超能力:2,幽靈:2,惡:.5,妖精:.5},鋼:{火:.5,水:.5,電:.5,冰:2,岩石:2,鋼:.5,妖精:2},妖精:{火:.5,格鬥:2,毒:.5,龍:2,惡:2,鋼:.5}};
const areas=[{name:'常青森林',icon:'🌲',pool:['venusaur','gengar']},{name:'湛藍海灣',icon:'🌊',pool:['blastoise','gengar']},{name:'傳說之地',icon:'🌌',pool:['mewtwo','rayquaza']}];
const key='pokemon-tag-fan-v2',app=document.getElementById('app');let old;try{old=JSON.parse(localStorage.getItem('starbeasts-save-v1')||'null')}catch(e){}let state;try{state=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}if(!state||!Array.isArray(state.owned))state={owned:['pikachu','charizard','greninja','lucario'],team:['pikachu','charizard','greninja'],custom:[],area:0,balls:3,greatBalls:1,wins:old?.wins||0};state.custom=Array.isArray(state.custom)?state.custom.filter(x=>x&&typeof x.id==='string'&&x.id.startsWith('custom-')).slice(0,100):[];const get=id=>base[id]||state.custom.find(m=>m.id===id);state.owned=state.owned.filter(id=>get(id));for(const id of ['pikachu','charizard','greninja','lucario'])if(!state.owned.includes(id))state.owned.push(id);state.team=(Array.isArray(state.team)?state.team:[]).filter((id,i,a)=>state.owned.includes(id)&&a.indexOf(id)===i).slice(0,3);state.area=Math.min(2,Math.max(0,Number(state.area)||0));state.balls=Math.max(0,Number(state.balls)||0);state.greatBalls=Math.max(0,Number(state.greatBalls)||0);state.wins=Math.max(0,Number(state.wins)||0);
let screen='home',fight=null,phaseTimer=0,frame=0,needle=0,ball='normal',busy=false,editing=null,notice='';function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stop(){if(frame)cancelAnimationFrame(frame);frame=0;clearTimeout(phaseTimer);phaseTimer=0}function go(s){stop();screen=s;notice='';render();window.scrollTo(0,0)}function toast(msg){notice=msg;render();setTimeout(()=>{if(notice===msg){notice='';app.querySelector('.toast')?.remove()}},2600)}function visual(m,klass=''){const dex=Number(m.dex);return `<span class="portrait ${klass}"><span class="fallback">${esc(m.emoji||'✦')}</span>${Number.isInteger(dex)&&dex>=1&&dex<=1100?`<img class="poke-art" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${dex}.png" alt="${esc(m.name)}" loading="lazy">`:''}</span>`}function head(back='collection'){return `<header><span class="brand">✦ <b>星獸</b>對決</span><button class="iconbtn" data-action="${back}" aria-label="返回或查看收藏">${back==='collection'?'▦':'←'}</button></header>`}function tag(m,id,chosen=false){return `<button class="tile ${chosen?'selected':''}" data-action="toggle" data-id="${esc(id)}" aria-pressed="${chosen}">${chosen?'<span class="tick">✓</span>':''}${visual(m,'small')}<strong>${esc(m.name)}</strong><small>${esc(m.types.join(' / '))} · ${'★'.repeat(m.star)}</small></button>`}function options(value){return types.map(t=>`<option value="${t}" ${t===value?'selected':''}>${t}</option>`).join('')}
function render(){let h='';if(screen==='home')h=head()+`<div class="eyebrow">FAN MADE · 手機卡匣冒險</div><h1 class="title">選擇 Pokémon<br>挑戰首領！</h1><p class="sub">從收藏挑 3 隻出戰，停下攻擊輪盤，再連點加力。不同屬性與速度會影響戰鬥。</p><div class="hero">${visual(base.mewtwo,'hero-art')}<span class="hero-label">傳說首領等待挑戰</span></div><button class="primary" data-action="team">開始冒險　➜</button><button class="secondary full" data-action="add">＋ 手動加入卡匣</button><div class="section"><h2>冒險紀錄</h2><small>${state.wins} 場勝利</small></div><div class="row"><div class="tile">${visual(base.pikachu,'small')}<strong>${state.owned.length} 張</strong><small>收藏卡匣</small></div><div class="tile"><span class="emoji">🔴</span><strong>${state.balls}</strong><small>精靈球</small></div><div class="tile"><span class="emoji">🟡</span><strong>${state.greatBalls}</strong><small>超級球</small></div></div><p class="note">非官方粉絲遊戲。卡匣範例數值與傷害公式為遊戲內設計。</p>`;
if(screen==='team')h=head('home')+`<div class="eyebrow">01 / TEAM</div><h1 class="title">選擇 3 張卡匣</h1><p class="sub">新增自己的 Pokémon 和卡匣能力值，或使用下方範例角色。</p><button class="secondary full" data-action="add">＋ 手動加入 Pokémon 卡匣</button><div class="section"><h2>我的收藏</h2><span class="pill">${state.team.length} / 3</span></div><div class="row">${state.owned.map(id=>tag(get(id),id,state.team.includes(id))).join('')}</div><div class="section"><h2>挑戰地區</h2></div><div class="regions">${areas.map((a,i)=>`<button class="region ${i===state.area?'current':''}" data-action="area" data-id="${i}"><span class="scene">${a.icon}</span><span><strong>${a.name}</strong><small>${a.pool.map(id=>base[id].name).join('／')}</small></span></button>`).join('')}</div><button class="primary" data-action="start" ${state.team.length===3?'':'disabled'}>出發挑戰　⚔</button>`;
if(screen==='add'){const m=editing?get(editing):null;h=head('collection')+`<div class="eyebrow">MY MEZA TAG</div><h1 class="title">${m?'修改卡匣':'手動加入角色'}</h1><p class="sub">照你的實體卡匣輸入名稱、屬性、招式和數值。圖鑑編號用來顯示角色圖片，可不填。</p><form id="tag-form"><label class="field">Pokémon 名稱<input name="name" required maxlength="24" placeholder="例如：伊布" value="${esc(m?.name||'')}"></label><div class="formgrid"><label class="field">圖鑑編號<input name="dex" type="number" min="1" max="1100" placeholder="例如：133" value="${esc(m?.dex||'')}"></label><label class="field">星級<select name="star">${[2,3,4,5,6].map(x=>`<option value="${x}" ${x===(m?.star||4)?'selected':''}>${x} ★</option>`).join('')}</select></label><label class="field">屬性 1<select name="type1">${options(m?.types[0]||'一般')}</select></label><label class="field">屬性 2<select name="type2"><option value="">無</option>${options(m?.types[1]||'')}</select></label></div><div class="formgrid statsgrid">${[['hp','HP',m?.hp||170],['atk','攻擊',m?.atk||120],['def','防禦',m?.def||110],['spd','速度',m?.spd||110]].map(([n,label,val])=>`<label class="field">${label}<input name="${n}" type="number" required min="1" max="999" value="${esc(val)}"></label>`).join('')}</div><div class="formgrid"><label class="field">招式名稱<input name="move" required maxlength="30" placeholder="例如：電光一閃" value="${esc(m?.move||'')}"></label><label class="field">招式屬性<select name="moveType">${options(m?.moveType||'一般')}</select></label></div><label class="field">招式威力<input name="power" type="number" required min="1" max="300" value="${esc(m?.power||80)}"></label><button class="primary" type="submit">${m?'儲存變更':'加入我的收藏'}　✓</button></form><p class="note">資料只儲存在此手機的瀏覽器。圖片需網路連線才能顯示。</p>`}
if(screen==='collection')h=head('home')+`<div class="eyebrow">MY COLLECTION</div><h1 class="title">我的 Pokémon</h1><p class="sub">${state.owned.length} 張卡匣 · ${state.wins} 場勝利</p><button class="secondary full" data-action="add">＋ 手動加入角色</button><div class="collection">${state.owned.map(id=>{let m=get(id);return `<div class="collect-card"><span class="stars">${'★'.repeat(m.star)}</span>${visual(m,'medium')}<strong>${esc(m.name)}</strong><small>${esc(m.types.join(' / '))} · HP ${m.hp}</small><small>ATK ${m.atk} · DEF ${m.def} · SPD ${m.spd}</small>${id.startsWith('custom-')?`<button class="edit" data-action="edit" data-id="${esc(id)}">修改數值</button>`:''}</div>`}).join('')}</div><button class="primary" data-action="team">編成隊伍　➜</button>`;
if(screen==='battle'){const m=get(fight.boss),a=get(fight.active),hp=Math.max(0,fight.hp);h=head('home')+`<div class="battle-top"><span class="pill">${areas[state.area].icon} ${areas[state.area].name}</span><span class="pill">第 ${fight.turn} 回合</span></div><div class="arena" id="arena"><div class="boss-rarity">${'★'.repeat(m.star)} · BOSS</div><div class="boss-name">${esc(m.name)}</div>${visual(m,'boss-art')}<div class="hp-label"><span>首領 HP</span><span>${hp} / ${m.hp}</span></div><div class="hp"><span style="width:${hp/m.hp*100}%"></span></div><div class="speech">${esc(fight.message)}</div></div><div class="section"><h2>選擇攻擊角色</h2><small>速度決定先後</small></div><div class="teamline">${state.team.map(id=>{let p=get(id),life=fight.allies[id];return `<button class="ally ${id===fight.active?'active':''} ${life<=0?'fainted':''}" data-action="ally" data-id="${esc(id)}" ${life<=0||fight.phase!=='ready'?'disabled':''}>${visual(p,'tiny')}<strong>${esc(p.name)}</strong><span class="health">${life} / ${p.hp}${fight.last===id?' · 疲勞':''}</span></button>`}).join('')}</div><div class="power-wrap"><div class="power-title">${fight.phase==='roulette'?'輪盤轉到中央，再按一次停下！':fight.phase==='charging'?`快速連點加力！${fight.taps} / 10`:`${esc(a.move)} · ${esc(a.moveType)} · 威力 ${a.power}`}</div><div class="meter"><div class="needle" id="needle" style="left:${needle}%"></div></div></div><button class="primary" data-action="attack" ${fight.phase==='resolving'?'disabled':''}>${fight.phase==='roulette'?'🎯 停下輪盤':fight.phase==='charging'?'⚡ 快速連點加力！':'⚔ 選定出戰'}</button><p class="note">${fight.last===fight.active?'疲勞：本回合沒有輪盤，速度降低。':'輪盤加成、連按加力和屬性相剋會改變傷害。'}</p>`}
if(screen==='capture'){let m=get(fight.boss);h=head('home')+`<div class="eyebrow">03 / CAPTURE</div><h1 class="title">捕捉時間！</h1><p class="sub">${esc(m.name)} 倒下了。選球並向上滑動，也可以按投球。</p><div class="arena compact"><div class="boss-rarity">${'★'.repeat(m.star)} · BOSS</div>${visual(m,'boss-art')}<div class="boss-name">${esc(m.name)}</div><div class="speech">${esc(fight.message)}</div></div><div class="throw-zone" id="throw-zone" role="button" tabindex="0"><span class="ball">${ball==='great'?'🟡':'🔴'}</span><strong>向上滑動投球 ↑</strong></div><div class="choice"><button class="${ball==='normal'?'current':''}" data-action="ball" data-id="normal" ${state.balls?'':'disabled'}>🔴 精靈球 × ${state.balls}</button><button class="${ball==='great'?'current':''}" data-action="ball" data-id="great" ${state.greatBalls?'':'disabled'}>🟡 超級球 × ${state.greatBalls}</button></div><button class="primary" data-action="throw" ${state.balls+state.greatBalls?'':'disabled'}>投出捕捉球　↑</button>${state.balls+state.greatBalls?'':'<button class="secondary full" data-action="home">返回主畫面</button>'}`}
if(screen==='result'){const m=get(fight.boss);h=head('home')+`<div class="eyebrow">MISSION COMPLETE</div><div class="result-panel">${visual(m,'result-art')}<h2>${fight.caught?'捕捉成功！':fight.lost?'這次先撤退！':'首領逃走了！'}</h2><p class="sub">${fight.caught?`「${esc(m.name)}」已加入收藏，下次能派牠上場。`:fight.lost?'換上克制首領的招式，再挑戰一次。':'重新挑戰，還有機會收服牠！'}</p></div><button class="primary" data-action="team">再玩一場　➜</button><button class="secondary full" data-action="collection">查看收藏</button>`}
app.innerHTML=h+(notice?`<div class="toast" role="status">${esc(notice)}</div>`:'');if(screen==='battle'&&fight.phase==='roulette')startMeter();if(screen==='capture'){let z=document.getElementById('throw-zone'),sy=null;z.addEventListener('pointerdown',e=>sy=e.clientY);z.addEventListener('pointerup',e=>{if(sy!=null&&sy-e.clientY>35)throwBall();sy=null});z.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();throwBall()}})}}
function effectiveness(move,target){return target.reduce((v,t)=>v*(chart[move]?.[t]??1),1)}function damage(attacker,defender,roulette,charge){const eff=effectiveness(attacker.moveType,defender.types);if(eff===0)return {value:0,eff};const stab=attacker.types.includes(attacker.moveType)?1.15:1;return {value:Math.max(1,Math.round((attacker.atk*attacker.power/Math.max(40,defender.def)*.38+6)*eff*stab*roulette*charge*(.9+Math.random()*.15))),eff}}
function startFight(){if(state.team.length!==3)return toast('請選滿 3 張卡匣');const pool=areas[state.area].pool,id=pool[Math.floor(Math.random()*pool.length)],boss=get(id);state.balls=Math.max(state.balls,3);state.greatBalls=Math.max(state.greatBalls,1);save();fight={boss:id,hp:boss.hp,allies:Object.fromEntries(state.team.map(x=>[x,get(x).hp])),active:state.team[0],last:null,turn:1,taps:0,roulette:1,phase:'ready',message:`野生的${boss.name}出現了！`,caught:false,lost:false};needle=0;go('battle')}
function startMeter(){if(frame)cancelAnimationFrame(frame);const start=performance.now();function tick(now){needle=(Math.sin((now-start)/330)+1)*50;let n=document.getElementById('needle');if(n)n.style.left=needle+'%';if(screen==='battle'&&fight.phase==='roulette')frame=requestAnimationFrame(tick)}frame=requestAnimationFrame(tick)}
function attack(){if(!fight||fight.phase==='resolving')return;if(fight.phase==='ready'){fight.taps=0;if(fight.active===fight.last){fight.roulette=1;fight.phase='charging';fight.message='連續出戰會疲勞！這回合略過輪盤，快連點加力。';render();phaseTimer=setTimeout(resolve,1900)}else{fight.phase='roulette';fight.message='停下攻擊輪盤！正中央有最高的加成。';render()}return}if(fight.phase==='roulette'){if(frame)cancelAnimationFrame(frame);frame=0;const grade=Math.round(Math.max(0,1-Math.abs(needle-50)/50)*4);fight.roulette=1+grade*.2;fight.phase='charging';fight.taps=0;fight.message=`輪盤 ${grade+1}！快連點按鈕，讓攻擊力升到 MAX。`;render();phaseTimer=setTimeout(resolve,1900);return}if(fight.phase==='charging'){fight.taps=Math.min(10,fight.taps+1);app.querySelector('.power-title').textContent=`快速連點加力！${fight.taps} / 10`;app.querySelector('.speech').textContent=fight.taps===10?'加力 MAX！':`已加力 ${fight.taps} 次！`}}
function resolve(){phaseTimer=0;if(screen!=='battle'||fight.phase!=='charging')return;fight.phase='resolving';let attacker=get(fight.active),boss=get(fight.boss),tired=fight.last===fight.active,charge=1+fight.taps*.07,bossFirst=boss.spd>attacker.spd*(tired?.65:1),messages=[];function strikeBoss(){let hit=damage(boss,attacker,1,1),taken=Math.max(8,Math.round(hit.value*.55));fight.allies[fight.active]=Math.max(0,fight.allies[fight.active]-taken);messages.push(`${boss.name}先攻，${attacker.name}受到 ${taken} 傷害`);return fight.allies[fight.active]>0}function strikePlayer(){let hit=damage(attacker,boss,fight.roulette,charge);fight.hp=Math.max(0,fight.hp-hit.value);messages.push(`${attacker.name}的${attacker.move}造成 ${hit.value} 傷害${hit.eff>1?'，效果絕佳！':hit.eff<1?'，效果不佳。':'。'}`)}if(bossFirst){if(strikeBoss())strikePlayer()}else{strikePlayer();if(fight.hp>0)strikeBoss()}fight.last=fight.active;if(fight.hp===0){state.wins++;save();fight.message='首領倒下，準備投球！';ball=state.balls?'normal':'great';go('capture');return}if(!state.team.some(id=>fight.allies[id]>0)){fight.lost=true;go('result');return}if(!fight.allies[fight.active]){fight.active=state.team.find(id=>fight.allies[id]>0);messages.push(`${get(fight.active).name}接替上場`)}fight.phase='ready';fight.turn++;fight.message=messages.join('；');render()}
function throwBall(){if(screen!=='capture'||busy)return;if(ball==='normal'&&!state.balls||ball==='great'&&!state.greatBalls)return toast('請選還有剩餘的球');busy=true;if(ball==='normal')state.balls--;else state.greatBalls--;save();app.querySelector('#throw-zone')?.classList.add('fly');let ok=Math.random()<(ball==='great'?.86:.64);setTimeout(()=>{busy=false;if(screen!=='capture')return;if(ok){fight.caught=true;if(!state.owned.includes(fight.boss))state.owned.push(fight.boss);save();go('result')}else if(state.balls+state.greatBalls){ball=state.balls?'normal':'great';fight.message='差一點！再投一次！';render()}else go('result')},750)}
app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let action=b.dataset.action,id=b.dataset.id;if(action==='home'){busy=false;go('home')}else if(action==='team')go('team');else if(action==='collection')go('collection');else if(action==='add'){editing=null;go('add')}else if(action==='edit'){editing=id;go('add')}else if(action==='toggle'){if(state.team.includes(id))state.team=state.team.filter(x=>x!==id);else if(state.team.length<3)state.team.push(id);else return toast('最多選 3 張，先取消一張');save();render()}else if(action==='area'){state.area=Number(id);save();render()}else if(action==='start')startFight();else if(action==='ally'){fight.active=id;fight.message=`換上${get(id).name}！`;render()}else if(action==='attack')attack();else if(action==='ball'){ball=id;render()}else if(action==='throw')throwBall()});
app.addEventListener('submit',e=>{if(e.target.id!=='tag-form')return;e.preventDefault();let form=new FormData(e.target),name=String(form.get('name')||'').trim(),move=String(form.get('move')||'').trim(),dex=String(form.get('dex')||'').trim(),stats={};for(const field of ['hp','atk','def','spd','power']){let n=Number(form.get(field));if(!Number.isInteger(n)||n<1||n>(field==='power'?300:999))return toast('能力值須為範圍內的整數');stats[field]=n}if(!name||!move)return toast('請填名稱和招式');if(dex&&(!Number.isInteger(Number(dex))||Number(dex)<1||Number(dex)>1100))return toast('請填有效圖鑑編號');if(state.custom.length>=100&&!editing)return toast('最多儲存 100 張自訂卡匣');const data={name:name.slice(0,24),move:move.slice(0,30),dex:dex?Number(dex):null,types:[form.get('type1'),form.get('type2')].filter(Boolean),moveType:form.get('moveType'),star:Number(form.get('star')),...stats};if(!types.includes(data.types[0])||data.types.some(x=>!types.includes(x))||!types.includes(data.moveType)||data.star<2||data.star>6)return toast('屬性或星級不正確');if(editing){const item=state.custom.find(x=>x.id===editing);if(!item)return toast('找不到這張卡匣');Object.assign(item,data)}else{const id='custom-'+Date.now()+'-'+Math.floor(Math.random()*1e6);state.custom.push({id,...data});state.owned.push(id)}save();go('collection');toast(editing?'已更新卡匣':'已加入收藏')});save();render();
})();
</script></body></html>
